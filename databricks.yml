# This is a Declarative Automation Bundle definition for tightening-analysis.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: tightening-analysis

variables:
  gpu_job_policy_id:
    description: Datalab single-node job policy (allows T4 GPU nodes)
    lookup:
      cluster_policy: "Datalab 03 Job Cluster Single Node"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-5678659344564033.13.azuredatabricks.net

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://adb-5678659344564033.13.azuredatabricks.net

# Scheduled production job: sources the Python file directly from the GitHub
# repo (no manual sync needed) and runs it daily on a dedicated job cluster.
resources:
  jobs:
    tightening_analysis_job:
      name: tightening-analysis-daily

      git_source:
        git_url: https://github.com/sisaklaci/tightening-analysis.git
        git_provider: gitHub
        git_branch: master

      job_clusters:
        - job_cluster_key: gpu_cluster
          new_cluster:
            # Admin-approved single-node GPU job policy ("Datalab 03 Job Cluster Single
            # Node") - the only policy that allows the T4 GPU node type for Jobs compute.
            # Single-node clusters run the driver only (num_workers: 0) and the policy
            # rejects autoscale / instance pool settings, so none are set here.
            policy_id: ${var.gpu_job_policy_id}
            apply_policy_default_values: true
            spark_version: 15.4.x-gpu-ml-scala2.12
            node_type_id: Standard_NC4as_T4_v3
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode

      tasks:
        - task_key: run_analysis
          job_cluster_key: gpu_cluster
          spark_python_task:
            python_file: tightening_analysis.py
            source: GIT

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Budapest
        pause_status: PAUSED
